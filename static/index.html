<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cartwise</title>
  <link rel="stylesheet" href="/static/style.css?v=6">
  <style>
    .color-chip{display:inline-flex!important;align-items:center;gap:5px;width:max-content;margin-top:7px!important;padding:3px 7px;border:1px solid var(--border);border-radius:999px;background:var(--surface);color:var(--text)!important;font-size:.72rem!important;font-weight:700}
    .color-chip i{display:block;width:9px;height:9px;border:1px solid rgba(20,33,61,.35);border-radius:50%;background:#8793a8}
    .color-blue i{background:#3383db}.color-black i{background:#202938}.color-red i{background:#e0494d}.color-green i{background:#2fa76b}.color-white i{background:#fff}.color-silver i{background:#aeb9c7}
    .products{grid-template-columns:repeat(auto-fit,minmax(210px,1fr));width:min(100%,620px);max-width:none}
    .product{min-height:126px;padding:15px 16px;box-shadow:0 5px 14px rgba(12,31,70,.12);transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}
    .product b{display:block;font-size:.94rem;letter-spacing:-.015em}.product .color-chip{margin:9px 0 4px!important}
    .product:hover{transform:translateY(-2px);box-shadow:0 10px 20px rgba(12,31,70,.18)}
    .messages{scrollbar-width:thin;scrollbar-color:var(--accent) transparent}.messages::-webkit-scrollbar{width:8px}.messages::-webkit-scrollbar-track{background:transparent}.messages::-webkit-scrollbar-thumb{background:var(--accent);border:2px solid var(--surface);border-radius:99px}
    .order-confirmation{align-self:flex-start;min-width:280px;padding:15px 16px;border:1px solid #2bb673;border-radius:14px;background:linear-gradient(135deg,#123e35,#185644);box-shadow:0 8px 18px rgba(0,0,0,.18);color:#effff6}.order-confirmation strong,.order-confirmation span{display:block}.order-confirmation span{margin-top:3px;color:#b8ecd2;font-size:.86rem}.order-id{margin-top:12px;padding:8px 10px;border-radius:9px;background:rgba(0,0,0,.2)}.order-id small{display:block;color:#9ee1be;font-size:.65rem;font-weight:800;letter-spacing:.11em}.order-id code{display:block;margin-top:3px;color:#fff;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:.82rem;word-break:break-all}
    main{max-width:1280px}.products{width:100%}
    @media(max-width:560px){.products{grid-template-columns:1fr;width:100%}.product{min-height:0}}
  </style>
  <link rel="stylesheet" href="/static/payment.css?v=1">
</head>
<body>
  <main>
    <header class="topbar">
      <a class="brand" href="/" aria-label="Cartwise home"><span class="brand-mark">C</span><span>Cartwise</span></a>
      <button id="theme-toggle" class="icon-button" type="button" aria-label="Switch theme">☾</button>
    </header>
    <section class="hero">
      <p class="eyebrow">SHOPPING, SIMPLIFIED</p>
      <h1>Find your next <span>favourite.</span></h1>
      <p>Tell us what you need and get helpful, catalog-backed recommendations.</p>
    </section>
    <section class="chat-shell" aria-label="Shopping assistant">
      <header class="chat-head">
        <div><p class="status"><i></i> Online now</p><h2>Cartwise assistant</h2></div>
        <button id="clear-chat" class="text-button" type="button">New chat</button>
      </header>
      <div id="messages" class="messages"><div class="bot">Hi! How can I help you find the right product today?</div></div>
      <div class="quick-prompts">
        <button type="button" data-prompt="show me running shoes under 3000">Running shoes</button>
        <button type="button" data-prompt="show me trail shoes">Trail shoes</button>
        <button type="button" data-prompt="anything under 1000">Under ₹1,000</button>
      </div>
      <form id="chat-form"><input id="message" placeholder="Ask about a product…" autocomplete="off" aria-label="Message the assistant"><button type="submit" aria-label="Send message">Send →</button></form>
      <div id="payment" class="payment"></div>
    </section>
  </main>
  <script src="/static/app.js?v=7"></script>
</body>
</html>
